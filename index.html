<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Controle Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div class="max-w-md mx-auto p-4 pb-12 space-y-5">
    
    <!-- Cabeçalho -->
    <header class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-800">Meu Controle</h1>
          <p id="status-nuvem" class="text-[10px] text-amber-600 font-medium">⚠️ Nuvem local (Configure a nuvem para salvar no GitHub)</p>
        </div>
        <button onclick="abrirConfigNuvem()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium transition">
          ⚙️ Configurar Nuvem
        </button>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
        <div class="flex gap-1.5">
          <button onclick="exportarCSV()" title="Exportar Backup" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-2 py-1 rounded-md font-medium transition">
            📥 Backup
          </button>
          <label title="Restaurar CSV" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-2 py-1 rounded-md font-medium cursor-pointer transition">
            📤 Restaurar
            <input type="file" id="arquivo-importar" accept=".csv" onchange="importarCSV(event)" class="hidden">
          </label>
        </div>
        <button onclick="limparTudo()" class="text-rose-500 hover:text-rose-700 underline">
          Limpar Dados
        </button>
      </div>
    </header>

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-emerald-500">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Receitas</p>
        <p id="total-receitas" class="text-sm font-bold text-emerald-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-rose-500">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Despesas</p>
        <p id="total-despesas" class="text-sm font-bold text-rose-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-blue-500">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Saldo</p>
        <p id="saldo-total" class="text-sm font-bold text-blue-600 mt-1">R$ 0,00</p>
      </div>
    </div>

    <!-- Painel de Detalhamento com Seletor de Mês -->
    <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">📊 Detalhamento por Mês</h2>
        <input type="month" id="filtro-mes" onchange="atualizarDetalhamentoMes()" class="text-xs bg-slate-100 text-slate-700 font-semibold px-2 py-1 rounded-lg border-0 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div id="container-categorias" class="space-y-2 text-xs">
        <!-- Inserido dinamicamente -->
      </div>
    </section>

    <!-- Formulário -->
    <section class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
      <h2 class="text-sm font-bold text-slate-700">Nova Transação</h2>
      <form id="finance-form" onsubmit="adicionarTransacao(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Ganhos Uber, Netflix, Mercado..." required class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo</label>
            <select id="tipo" onchange="atualizarCategorias()" class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="Despesa">Despesa (-)</option>
              <option value="Receita">Receita (+)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Categoria</label>
            <select id="categoria" class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <!-- Opções carregadas via JS -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Data</label>
            <input type="date" id="data" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-3 rounded-xl text-sm transition">Adicionar Transação</button>
      </form>
    </section>

    <!-- Gráfico -->
    <section class="bg-white p-5 rounded-2xl shadow-sm">
      <h2 class="text-sm font-bold text-slate-700 mb-3">Resumo Visual Geral</h2>
      <canvas id="graficoFinanceiro"></canvas>
    </section>

    <!-- Lista de Histórico -->
    <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="text-sm font-bold text-slate-700">Histórico de Lançamentos</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b text-slate-400 uppercase">
              <th class="py-2">Item</th>
              <th class="py-2">Valor</th>
              <th class="py-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes" class="divide-y">
            <!-- Itens inseridos via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const categoriasOpcoes = {
      Despesa: ['🛒 Alimentação', '⛽ Combustível', '🏠 Moradia', '🚗 Transporte', '🎉 Lazer', '💊 Saúde', '🔧 Manutenção Veículo', '💳 Assinaturas, dívidas, serviços', '📦 Outros'],
      Receita: ['💼 Salário', '🚗 Uber / Apps', '📈 Rendimentos', '🎁 Outros']
    };

    let transacoes = JSON.parse(localStorage.getItem('transacoesFinanceiras')) || [];
    let meuGrafico = null;

    // Configurações do GitHub atualizadas com o seu utilizador correto
    let ghConfig = JSON.parse(localStorage.getItem('ghConfig')) || {
      owner: 'changluis2016-jpg',
      repo: 'Financeiro',
      token: ''
    };

    const hoje = new Date();
    document.getElementById('data').valueAsDate = hoje;
    const mesAtualDefault = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('filtro-mes').value = mesAtualDefault;

    // Inicialização
    atualizarCategorias();
    verificarEstadoNuvem();
    carregarDadosDoGitHub();

    function atualizarCategorias() {
      const tipo = document.getElementById('tipo').value;
      const selectCategoria = document.getElementById('categoria');
      selectCategoria.innerHTML = '';
      
      categoriasOpcoes[tipo].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        selectCategoria.appendChild(option);
      });
    }

    function adicionarTransacao(e) {
      e.preventDefault();
      const descricao = document.getElementById('descricao').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;
      const data = document.getElementById('data').value;

      transacoes.push({ id: Date.now(), descricao, valor, tipo, categoria, data });
      salvarESincronizar();

      document.getElementById('descricao').value = '';
      document.getElementById('valor').value = '';
    }

    function removerTransacao(id) {
      transacoes = transacoes.filter(t => t.id !== id);
      salvarESincronizar();
    }

    function limparTudo() {
      if (confirm('Tem certeza que deseja apagar todos os registros?')) {
        transacoes = [];
        salvarESincronizar();
      }
    }

    function salvarESincronizar() {
      localStorage.setItem('transacoesFinanceiras', JSON.stringify(transacoes));
      atualizarInterface();
      salvarDadosNoGitHub();
    }

    function formatarMoeda(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function atualizarInterface() {
      let receitas = 0;
      let despesas = 0;
      const listaTbody = document.getElementById('lista-transacoes');
      listaTbody.innerHTML = '';

      const transacoesOrdenadas = [...transacoes].sort((a, b) => new Date(b.data) - new Date(a.data));

      transacoesOrdenadas.forEach(t => {
        if (t.tipo === 'Receita') receitas += t.valor;
        if (t.tipo === 'Despesa') despesas += t.valor;

        const cat = t.categoria || '📦 Outros';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="py-2.5">
            <div class="font-semibold text-slate-700">${t.descricao}</div>
            <div class="text-[10px] text-slate-400">${cat} • ${t.data.split('-').reverse().join('/')}</div>
          </td>
          <td class="py-2.5 font-bold ${t.tipo === 'Receita' ? 'text-emerald-600' : 'text-rose-600'}">
            ${t.tipo === 'Receita' ? '+' : '-'} ${formatarMoeda(t.valor)}
          </td>
          <td class="py-2.5 text-right">
            <button onclick="removerTransacao(${t.id})" class="text-slate-400 hover:text-rose-500 font-bold px-1">✕</button>
          </td>
        `;
        listaTbody.appendChild(tr);
      });

      document.getElementById('total-receitas').textContent = formatarMoeda(receitas);
      document.getElementById('total-despesas').textContent = formatarMoeda(despesas);
      document.getElementById('saldo-total').textContent = formatarMoeda(receitas - despesas);

      atualizarDetalhamentoMes();
      atualizarGrafico(receitas, despesas);
    }

    function atualizarDetalhamentoMes() {
      const mesSelecionado = document.getElementById('filtro-mes').value || mesAtualDefault;
      const despesasMes = transacoes.filter(t => t.tipo === 'Despesa' && t.data.startsWith(mesSelecionado));
      
      const totaisPorCat = {};
      let totalDespesasMes = 0;

      despesasMes.forEach(t => {
        const cat = t.categoria || '📦 Outros';
        totaisPorCat[cat] = (totaisPorCat[cat] || 0) + t.valor;
        totalDespesasMes += t.valor;
      });

      const container = document.getElementById('container-categorias');
      container.innerHTML = '';

      if (Object.keys(totaisPorCat).length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhuma despesa registrada neste mês.</p>`;
        return;
      }

      Object.entries(totaisPorCat)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, valor]) => {
          const pct = totalDespesasMes > 0 ? ((valor / totalDespesasMes) * 100).toFixed(0) : 0;
          
          const item = document.createElement('div');
          item.className = "space-y-1";
          item.innerHTML = `
            <div class="flex justify-between font-medium">
              <span class="text-slate-700">${cat}</span>
              <span class="font-bold text-slate-800">${formatarMoeda(valor)} <span class="text-[10px] text-slate-400 font-normal">(${pct}%)</span></span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-1.5">
              <div class="bg-rose-500 h-1.5 rounded-full" style="width: ${pct}%"></div>
            </div>
          `;
          container.appendChild(item);
        });
    }

    function atualizarGrafico(receitas, despesas) {
      const ctx = document.getElementById('graficoFinanceiro').getContext('2d');
      if (meuGrafico) meuGrafico.destroy();

      meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Receitas', 'Despesas'],
          datasets: [{
            data: [receitas, despesas],
            backgroundColor: ['#10b981', '#f43f5e']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    // --- INTEGRAÇÃO COM DADOS.JSON NO GITHUB ---

    function verificarEstadoNuvem() {
      const statusEl = document.getElementById('status-nuvem');
      if (ghConfig.token) {
        statusEl.textContent = '☁️ Nuvem GitHub Ativa (Sincronizado)';
        statusEl.className = 'text-[10px] text-emerald-600 font-semibold';
      } else {
        statusEl.textContent = '⚠️ Modo Local (Configure a nuvem para salvar no GitHub)';
        statusEl.className = 'text-[10px] text-amber-600 font-medium';
      }
    }

    function abrirConfigNuvem() {
      const repo = prompt('Nome do Repositório no GitHub:', ghConfig.repo);
      if (repo === null) return;
      const token = prompt('Insira o seu Personal Access Token (PAT) do GitHub:', ghConfig.token);
      if (token === null) return;

      ghConfig.repo = repo.trim();
      ghConfig.token = token.trim();
      localStorage.setItem('ghConfig', JSON.stringify(ghConfig));
      verificarEstadoNuvem();
      carregarDadosDoGitHub();
      alert('Configuração salva com sucesso!');
    }

    async function carregarDadosDoGitHub() {
      if (!ghConfig.token) return;
      try {
        const url = `https://raw.githubusercontent.com/${ghConfig.owner}/${ghConfig.repo}/main/dados.json?t=${Date.now()}`;
        const res = await fetch(url);
        if (res.ok) {
          const dadosNuvem = await res.json();
          if (Array.isArray(dadosNuvem) && dadosNuvem.length > 0) {
            transacoes = dadosNuvem;
            localStorage.setItem('transacoesFinanceiras', JSON.stringify(transacoes));
            atualizarInterface();
          }
        }
      } catch (err) {
        console.log('Usando dados locais (offline ou dados.json ainda não criado).');
      }
    }

    async function salvarDadosNoGitHub() {
      if (!ghConfig.token) return;
      try {
        const apiGetUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/dados.json`;
        
        let sha = '';
        const resGet = await fetch(apiGetUrl, {
          headers: { 'Authorization': `token ${ghConfig.token}` }
        });
        if (resGet.ok) {
          const fileData = await resGet.json();
          sha = fileData.sha;
        }

        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(transacoes, null, 2))));
        const bodyData = {
          message: "Atualização automática de dados financeiros",
          content: contentBase64,
          branch: "main"
        };
        if (sha) bodyData.sha = sha;

        await fetch(apiGetUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${ghConfig.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });
      } catch (err) {
        console.error('Erro ao sincronizar com o GitHub:', err);
      }
    }

    // --- BACKUP E RESTAURAR CSV ---

    function exportarCSV() {
      if (transacoes.length === 0) {
        alert('Não há dados para exportar!');
        return;
      }
      let csv = '\uFEFFDescrição;Valor;Tipo;Categoria;Data\n';
      transacoes.forEach(t => {
        const cat = t.categoria || '📦 Outros';
        csv += `"${t.descricao}";${t.valor};"${t.tipo}";"${cat}";"${t.data}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_financeiro_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importarCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const linhas = e.target.result.split('\n');
        let importados = 0;
        for (let i = 1; i < linhas.length; i++) {
          const linha = linhas[i].trim();
          if (!linha) continue;
          const cols = linha.split(';').map(c => c.replace(/^"|"$/g, ''));
          if (cols.length >= 5) {
            const [descricao, valorStr, tipo, categoria, data] = cols;
            const valor = parseFloat(valorStr.replace(',', '.'));
            if (descricao && !isNaN(valor) && tipo && data) {
              transacoes.push({
                id: Date.now() + Math.random(),
                descricao,
                valor,
                tipo,
                categoria,
                data
              });
              importados++;
            }
          }
        }
        if (importados > 0) {
          salvarESincronizar();
          alert(`${importados} lançamentos restaurados e salvos com sucesso!`);
        } else {
          alert('Ficheiro inválido.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // Inicialização visual
    atualizarInterface();
  </script>
</body>
</html>
