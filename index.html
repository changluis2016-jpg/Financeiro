<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Controle Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div class="max-w-md mx-auto p-4 pb-12 space-y-5">
    
    <!-- Cabeçalho -->
    <header class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700/50 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-100">Meu Controle</h1>
          <p id="status-nuvem" class="text-[10px] text-amber-400 font-medium">⚠️ Nuvem local (Configure a nuvem)</p>
        </div>
        <button onclick="abrirConfigNuvem()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg font-medium transition border border-slate-600">
          ⚙️ Configurar Nuvem
        </button>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-700/60 text-xs">
        <div class="flex gap-1.5">
          <button onclick="exportarCSV()" title="Exportar Backup" class="bg-emerald-950/60 text-emerald-400 hover:bg-emerald-900/80 border border-emerald-800/50 px-2 py-1 rounded-md font-medium transition">
            📥 Backup
          </button>
          <label title="Restaurar CSV" class="bg-blue-950/60 text-blue-400 hover:bg-blue-900/80 border border-blue-800/50 px-2 py-1 rounded-md font-medium cursor-pointer transition">
            📤 Restaurar
            <input type="file" id="arquivo-importar" accept=".csv" onchange="importarCSV(event)" class="hidden">
          </label>
        </div>
        <button onclick="limparTudo()" class="text-rose-400 hover:text-rose-300 underline">
          Limpar Dados
        </button>
      </div>
    </header>

    <!-- Cards de Resumo Clicáveis -->
    <div class="grid grid-cols-3 gap-2">
      <div id="card-receitas" onclick="mudarModoDetalhamento('Receita')" class="bg-slate-800 p-3 rounded-2xl shadow-lg border-l-4 border-emerald-500 border-y border-r border-slate-700/50 cursor-pointer hover:bg-slate-700/40 transition">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Receitas 🟢</p>
        <p id="total-receitas" class="text-sm font-bold text-emerald-400 mt-1">R$ 0,00</p>
      </div>
      <div id="card-despesas" onclick="mudarModoDetalhamento('Despesa')" class="bg-slate-800 p-3 rounded-2xl shadow-lg border-l-4 border-rose-500 border-y border-r border-slate-700/50 cursor-pointer hover:bg-slate-700/40 transition">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Despesas 🔴</p>
        <p id="total-despesas" class="text-sm font-bold text-rose-400 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-slate-800 p-3 rounded-2xl shadow-lg border-l-4 border-blue-500 border-y border-r border-slate-700/50">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Saldo</p>
        <p id="saldo-total" class="text-sm font-bold text-blue-400 mt-1">R$ 0,00</p>
      </div>
    </div>

    <!-- Painel de Detalhamento com Seletor de Mês -->
    <section class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700/50 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h2 id="titulo-detalhamento" class="text-sm font-bold text-slate-200">📊 Detalhamento de Despesas</h2>
          <p class="text-[10px] text-slate-400">Clique em uma categoria para ver detalhes semanais</p>
        </div>
        <input type="month" id="filtro-mes" onchange="atualizarDetalhamentoMes()" class="text-xs bg-slate-900 text-slate-200 font-semibold px-2 py-1 rounded-lg border border-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div id="container-categorias" class="space-y-2 text-xs">
        <!-- Inserido dinamicamente -->
      </div>
    </section>

    <!-- Formulário -->
    <section class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700/50 space-y-4">
      <h2 class="text-sm font-bold text-slate-200">Nova Transação</h2>
      <form id="finance-form" onsubmit="adicionarTransacao(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Ganhos Uber, Netflix, Mercado..." required class="w-full p-2.5 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00" required class="w-full p-2.5 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tipo</label>
            <select id="tipo" onchange="atualizarCategorias()" class="w-full p-2.5 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Despesa">Despesa (-)</option>
              <option value="Receita">Receita (+)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Categoria</label>
            <select id="categoria" class="w-full p-2.5 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <!-- Opções carregadas via JS -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Data</label>
            <input type="date" id="data" required class="w-full p-2.5 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium p-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/30">Adicionar Transação</button>
      </form>
    </section>

    <!-- Gráfico -->
    <section class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700/50">
      <h2 class="text-sm font-bold text-slate-200 mb-3">Resumo Visual Geral</h2>
      <canvas id="graficoFinanceiro"></canvas>
    </section>

    <!-- Lista de Histórico -->
    <section class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700/50 space-y-3">
      <h2 class="text-sm font-bold text-slate-200">Histórico de Lançamentos</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400 uppercase">
              <th class="py-2">Item</th>
              <th class="py-2">Valor</th>
              <th class="py-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes" class="divide-y divide-slate-700/50">
            <!-- Itens inseridos via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- MODAL DE DETALHAMENTO SEMANAL -->
  <div id="modal-semanal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Cabeçalho do Modal -->
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
        <div>
          <h3 id="modal-cat-nome" class="text-base font-bold text-slate-100">Categoria</h3>
          <p id="modal-cat-mes" class="text-xs text-slate-400">Outubro de 2026</p>
        </div>
        <button onclick="fecharModalSemanal()" class="text-slate-400 hover:text-slate-100 text-xl font-bold bg-slate-700/50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
      </div>

      <!-- Conteúdo do Modal (Scrollável) -->
      <div id="modal-cat-conteudo" class="p-4 overflow-y-auto space-y-4 text-xs">
        <!-- Inserido dinamicamente via JS -->
      </div>
    </div>
  </div>

  <script>
    const categoriasOpcoes = {
      Despesa: ['🛒 Alimentação', '⛽ Combustível', '🏠 Moradia', '🚗 Transporte', '🎉 Lazer', '💊 Saúde', '🔧 Manutenção Veículo', '💳 Assinaturas, dívidas, serviços', '📦 Outros'],
      Receita: ['💼 Salário', '🚗 Uber / Apps', '📈 Rendimentos', '🎁 Outros']
    };

    let modoDetalhamento = 'Despesa'; 
    let transacoes = JSON.parse(localStorage.getItem('transacoesFinanceiras')) || [];
    let meuGrafico = null;

    let ghConfig = JSON.parse(localStorage.getItem('ghConfig')) || {
      owner: 'changluis2016-jpg',
      repo: 'Financeiro',
      token: ''
    };

    const hoje = new Date();
    document.getElementById('data').valueAsDate = hoje;
    const mesAtualDefault = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('filtro-mes').value = mesAtualDefault;

    // Inicialização
    atualizarCategorias();
    verificarEstadoNuvem();
    carregarDadosDoGitHub();

    function mudarModoDetalhamento(tipo) {
      modoDetalhamento = tipo;
      atualizarDetalhamentoMes();
    }

    function atualizarCategorias() {
      const tipo = document.getElementById('tipo').value;
      const selectCategoria = document.getElementById('categoria');
      selectCategoria.innerHTML = '';
      
      categoriasOpcoes[tipo].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        selectCategoria.appendChild(option);
      });
    }

    function adicionarTransacao(e) {
      e.preventDefault();
      const descricao = document.getElementById('descricao').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;
      const data = document.getElementById('data').value;

      transacoes.push({ id: Date.now(), descricao, valor, tipo, categoria, data });
      salvarESincronizar();

      document.getElementById('descricao').value = '';
      document.getElementById('valor').value = '';
    }

    function removerTransacao(id) {
      transacoes = transacoes.filter(t => t.id !== id);
      salvarESincronizar();
    }

    function limparTudo() {
      if (confirm('Tem certeza que deseja apagar todos os registros?')) {
        transacoes = [];
        salvarESincronizar();
      }
    }

    function salvarESincronizar() {
      localStorage.setItem('transacoesFinanceiras', JSON.stringify(transacoes));
      atualizarInterface();
      salvarDadosNoGitHub();
    }

    function formatarMoeda(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function atualizarInterface() {
      let receitas = 0;
      let despesas = 0;
      const listaTbody = document.getElementById('lista-transacoes');
      listaTbody.innerHTML = '';

      const transacoesOrdenadas = [...transacoes].sort((a, b) => new Date(b.data) - new Date(a.data));

      transacoesOrdenadas.forEach(t => {
        if (t.tipo === 'Receita') receitas += t.valor;
        if (t.tipo === 'Despesa') despesas += t.valor;

        const cat = t.categoria || '📦 Outros';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-700/30";
        tr.innerHTML = `
          <td class="py-2.5">
            <div class="font-semibold text-slate-200">${t.descricao}</div>
            <div class="text-[10px] text-slate-400">${cat} • ${t.data.split('-').reverse().join('/')}</div>
          </td>
          <td class="py-2.5 font-bold ${t.tipo === 'Receita' ? 'text-emerald-400' : 'text-rose-400'}">
            ${t.tipo === 'Receita' ? '+' : '-'} ${formatarMoeda(t.valor)}
          </td>
          <td class="py-2.5 text-right">
            <button onclick="removerTransacao(${t.id})" class="text-slate-500 hover:text-rose-400 font-bold px-1">✕</button>
          </td>
        `;
        listaTbody.appendChild(tr);
      });

      document.getElementById('total-receitas').textContent = formatarMoeda(receitas);
      document.getElementById('total-despesas').textContent = formatarMoeda(despesas);
      document.getElementById('saldo-total').textContent = formatarMoeda(receitas - despesas);

      atualizarDetalhamentoMes();
      atualizarGrafico(receitas, despesas);
    }

    function atualizarDetalhamentoMes() {
      const mesSelecionado = document.getElementById('filtro-mes').value || mesAtualDefault;
      const transacoesFiltradas = transacoes.filter(t => t.tipo === modoDetalhamento && t.data.startsWith(mesSelecionado));
      
      const tituloEl = document.getElementById('titulo-detalhamento');
      tituloEl.textContent = modoDetalhamento === 'Receita' ? '📊 Detalhamento de Receitas' : '📊 Detalhamento de Despesas';

      const totaisPorCat = {};
      let totalGeralMes = 0;

      transacoesFiltradas.forEach(t => {
        const cat = t.categoria || '📦 Outros';
        totaisPorCat[cat] = (totaisPorCat[cat] || 0) + t.valor;
        totalGeralMes += t.valor;
      });

      const container = document.getElementById('container-categorias');
      container.innerHTML = '';

      if (Object.keys(totaisPorCat).length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhuma ${modoDetalhamento.toLowerCase()} registrada neste mês.</p>`;
        return;
      }

      const corBarra = modoDetalhamento === 'Receita' ? 'bg-emerald-500' : 'bg-rose-500';

      Object.entries(totaisPorCat)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, valor]) => {
          const pct = totalGeralMes > 0 ? ((valor / totalGeralMes) * 100).toFixed(0) : 0;
          
          const item = document.createElement('div');
          item.className = "space-y-1 cursor-pointer bg-slate-900/40 p-2 rounded-xl hover:bg-slate-700/40 transition border border-slate-700/30";
          item.onclick = () => abrirDetalhamentoSemanal(cat, mesSelecionado, modoDetalhamento);
          item.innerHTML = `
            <div class="flex justify-between font-medium">
              <span class="text-slate-300">${cat}</span>
              <span class="font-bold text-slate-200">${formatarMoeda(valor)} <span class="text-[10px] text-slate-400 font-normal">(${pct}%)</span></span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-1.5">
              <div class="${corBarra} h-1.5 rounded-full" style="width: ${pct}%"></div>
            </div>
          `;
          container.appendChild(item);
        });
    }

    function abrirDetalhamentoSemanal(categoria, mesAno, tipoTransacao) {
      const modal = document.getElementById('modal-semanal');
      document.getElementById('modal-cat-nome').textContent = `${categoria} (${tipoTransacao}s)`;
      
      const [ano, mes] = mesAno.split('-');
      const nomeMes = new Date(ano, mes - 1).toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
      document.getElementById('modal-cat-mes').textContent = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);

      const itemsCat = transacoes.filter(t => t.tipo === tipoTransacao && t.categoria === categoria && t.data.startsWith(mesAno));

      const semanas = { 'Semana 1 (1-7)': [], 'Semana 2 (8-14)': [], 'Semana 3 (15-21)': [], 'Semana 4 (22-fim)': [] };

      itemsCat.forEach(t => {
        const dia = parseInt(t.data.split('-')[2]);
        if (dia <= 7) semanas['Semana 1 (1-7)'].push(t);
        else if (dia <= 14) semanas['Semana 2 (8-14)'].push(t);
        else if (dia <= 21) semanas['Semana 3 (15-21)'].push(t);
        else semanas['Semana 4 (22-fim)'].push(t);
      });

      const container = document.getElementById('modal-cat-conteudo');
      container.innerHTML = '';

      const corTextoVal = tipoTransacao === 'Receita' ? 'text-emerald-400' : 'text-rose-400';

      Object.entries(semanas).forEach(([nomeSemana, lista]) => {
        const totalSemana = lista.reduce((acc, curr) => acc + curr.valor, 0);

        const blk = document.createElement('div');
        blk.className = "bg-slate-900 p-3 rounded-xl border border-slate-700/60 space-y-2";

        let htmlLista = '';
        if (lista.length === 0) {
          htmlLista = `<p class="text-[11px] text-slate-500 italic">Nenhum registro nesta semana.</p>`;
        } else {
          lista.sort((a, b) => new Date(b.data) - new Date(a.data)).forEach(i => {
            htmlLista += `
              <div class="flex justify-between items-center text-[11px] border-b border-slate-800 py-1 last:border-0">
                <span class="text-slate-300">${i.descricao} <span class="text-[9px] text-slate-500">(${i.data.split('-').reverse().join('/')})</span></span>
                <span class="font-bold ${corTextoVal}">${formatarMoeda(i.valor)}</span>
              </div>
            `;
          });
        }

        blk.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-700/50 pb-1">
            <span class="font-bold text-slate-200 text-xs">${nomeSemana}</span>
            <span class="font-bold ${corTextoVal} text-xs">${formatarMoeda(totalSemana)}</span>
          </div>
          <div class="space-y-1">
            ${htmlLista}
          </div>
        `;
        container.appendChild(blk);
      });

      modal.classList.remove('hidden');
    }

    function fecharModalSemanal() {
      document.getElementById('modal-semanal').classList.add('hidden');
    }

    function atualizarGrafico(receitas, despesas) {
      const ctx = document.getElementById('graficoFinanceiro').getContext('2d');
      if (meuGrafico) meuGrafico.destroy();

      meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Receitas', 'Despesas'],
          datasets: [{
            data: [receitas, despesas],
            backgroundColor: ['#10b981', '#f43f5e'],
            borderColor: '#1e293b'
          }]
        },
        options: {
          responsive: true,
          plugins: { 
            legend: { 
              position: 'bottom',
              labels: { color: '#cbd5e1' }
            } 
          }
        }
      });
    }

    // --- INTEGRAÇÃO COM DADOS.JSON NO GITHUB (COM CORREÇÃO DE CORS) ---

    function verificarEstadoNuvem() {
      const statusEl = document.getElementById('status-nuvem');
      if (ghConfig.token) {
        statusEl.textContent = '☁️ Nuvem GitHub Ativa (Sincronizado)';
        statusEl.className = 'text-[10px] text-emerald-400 font-semibold';
      } else {
        statusEl.textContent = '⚠️ Modo Local (Clique em Configurar Nuvem)';
        statusEl.className = 'text-[10px] text-amber-400 font-medium';
      }
    }

    function abrirConfigNuvem() {
      const repo = prompt('Nome do Repositório no GitHub:', ghConfig.repo);
      if (repo === null) return;
      const token = prompt('Insira o seu Personal Access Token (PAT) do GitHub (começa com ghp_):', ghConfig.token);
      if (token === null) return;

      ghConfig.repo = repo.trim();
      ghConfig.token = token.trim();
      localStorage.setItem('ghConfig', JSON.stringify(ghConfig));
      verificarEstadoNuvem();
      carregarDadosDoGitHub();
      alert('Configuração salva com sucesso!');
    }

    async function carregarDadosDoGitHub() {
      if (!ghConfig.token) return;
      try {
        const url = `https://raw.githubusercontent.com/${ghConfig.owner}/${ghConfig.repo}/main/dados.json?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          const dadosNuvem = await res.json();
          if (Array.isArray(dadosNuvem)) {
            transacoes = dadosNuvem;
            localStorage.setItem('transacoesFinanceiras', JSON.stringify(transacoes));
            atualizarInterface();
          }
        }
      } catch (err) {
        console.log('Usando dados locais.');
      }
    }

    async function salvarDadosNoGitHub() {
      if (!ghConfig.token) {
        alert('Atenção: Token da nuvem não configurado. As alterações só foram salvas no telemóvel.');
        return;
      }
      try {
        const apiGetUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/dados.json?t=${Date.now()}`;
        
        let sha = '';
        const resGet = await fetch(apiGetUrl, {
          method: 'GET',
          mode: 'cors',
          headers: { 
            'Authorization': `token ${ghConfig.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Cache-Control': 'no-cache'
          }
        });

        if (resGet.ok) {
          const fileData = await resGet.json();
          sha = fileData.sha;
        } else if (resGet.status !== 404) {
          const errJson = await resGet.json();
          alert('Erro ao obter SHA do GitHub: ' + (errJson.message || resGet.status));
          return;
        }

        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(transacoes, null, 2))));
        const bodyData = {
          message: "Atualização automática de dados financeiros",
          content: contentBase64,
          branch: "main"
        };
        if (sha) bodyData.sha = sha;

        const resPut = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/dados.json`, {
          method: 'PUT',
          mode: 'cors',
          headers: {
            'Authorization': `token ${ghConfig.token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json',
            'Cache-Control': 'no-cache'
          },
          body: JSON.stringify(bodyData)
        });

        if (!resPut.ok) {
          const errData = await resPut.json();
          alert('Erro ao gravar no GitHub (PUT): ' + (errData.message || resPut.status));
        }
      } catch (err) {
        alert('Erro de conexão ao salvar na nuvem: ' + err.message);
      }
    }

    // --- BACKUP E RESTAURAR CSV ---

    function exportarCSV() {
      if (transacoes.length === 0) {
        alert('Não há dados para exportar!');
        return;
      }
      let csv = '\uFEFFDescrição;Valor;Tipo;Categoria;Data\n';
      transacoes.forEach(t => {
        const cat = t.categoria || '📦 Outros';
        csv += `"${t.descricao}";${t.valor};"${t.tipo}";"${cat}";"${t.data}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `backup_financeiro_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importarCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const linhas = e.target.result.split('\n');
        let importados = 0;
        for (let i = 1; i < linhas.length; i++) {
          const linha = linhas[i].trim();
          if (!linha) continue;
          const cols = linha.split(';').map(c => c.replace(/^"|"$/g, ''));
          if (cols.length >= 5) {
            const [descricao, valorStr, tipo, categoria, data] = cols;
            const valor = parseFloat(valorStr.replace(',', '.'));
            if (descricao && !isNaN(valor) && tipo && data) {
              transacoes.push({
                id: Date.now() + Math.random(),
                descricao,
                valor,
                tipo,
                categoria,
                data
              });
              importados++;
            }
          }
        }
        if (importados > 0) {
          salvarESincronizar();
          alert(`${importados} lançamentos restaurados e salvos com sucesso!`);
        } else {
          alert('Ficheiro inválido.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // Inicialização visual
    atualizarInterface();
  </script>
</body>
</html>
