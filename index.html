<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Controle Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div class="max-w-md mx-auto p-4 pb-12 space-y-5">
    
    <!-- Cabeçalho com botões de Backup e Restaurar -->
    <header class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm">
      <div>
        <h1 class="text-xl font-bold text-slate-800">Meu Controle</h1>
        <p class="text-xs text-slate-500">Acompanhamento diário</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="exportarCSV()" title="Exportar Backup em CSV" class="text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg font-medium transition">
          📥 Backup
        </button>
        <label title="Importar Backup de CSV" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 px-2.5 py-1.5 rounded-lg font-medium cursor-pointer transition">
          📤 Restaurar
          <input type="file" id="arquivo-importar" accept=".csv" onchange="importarCSV(event)" class="hidden">
        </label>
        <button onclick="limparTudo()" title="Apagar todos os dados" class="text-xs text-rose-500 hover:text-rose-700 underline ml-1">
          Limpar
        </button>
      </div>
    </header>

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-emerald-500">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Receitas</p>
        <p id="total-receitas" class="text-sm font-bold text-emerald-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-rose-500">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Despesas</p>
        <p id="total-despesas" class="text-sm font-bold text-rose-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-blue-500">
        <p class="text-[10px] font-semibold text-slate-400 uppercase">Saldo</p>
        <p id="saldo-total" class="text-sm font-bold text-blue-600 mt-1">R$ 0,00</p>
      </div>
    </div>

    <!-- Painel de Detalhamento das Despesas do Mês -->
    <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">📊 Detalhamento do Mês</h2>
        <span id="mes-atual-label" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-md font-medium"></span>
      </div>
      <div id="container-categorias" class="space-y-2 text-xs">
        <!-- Inserido dinamicamente via JS -->
      </div>
    </section>

    <!-- Formulário -->
    <section class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
      <h2 class="text-sm font-bold text-slate-700">Nova Transação</h2>
      <form id="finance-form" onsubmit="adicionarTransacao(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Ganhos Uber, Combustível..." required class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo</label>
            <select id="tipo" onchange="atualizarCategorias()" class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="Despesa">Despesa (-)</option>
              <option value="Receita">Receita (+)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Categoria</label>
            <select id="categoria" class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <!-- Opções carregadas via JS -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Data</label>
            <input type="date" id="data" required class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-3 rounded-xl text-sm transition">Adicionar Transação</button>
      </form>
    </section>

    <!-- Gráfico -->
    <section class="bg-white p-5 rounded-2xl shadow-sm">
      <h2 class="text-sm font-bold text-slate-700 mb-3">Resumo Visual</h2>
      <canvas id="graficoFinanceiro"></canvas>
    </section>

    <!-- Lista de Histórico -->
    <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="text-sm font-bold text-slate-700">Histórico de Lançamentos</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b text-slate-400 uppercase">
              <th class="py-2">Item</th>
              <th class="py-2">Valor</th>
              <th class="py-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes" class="divide-y">
            <!-- Itens inseridos via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const categoriasOpcoes = {
      Despesa: ['🛒 Alimentação', '⛽ Combustível', '🏠 Moradia', '🚗 Transporte', '🎉 Lazer', '💊 Saúde', '🔧 Manutenção Veículo', '📦 Outros'],
      Receita: ['💼 Salário', '🚗 Uber / Apps', '📈 Rendimentos', '🎁 Outros']
    };

    let transacoes = JSON.parse(localStorage.getItem('transacoesFinanceiras')) || [];
    let meuGrafico = null;

    // Preenche a data de hoje por padrão
    document.getElementById('data').valueAsDate = new Date();

    function atualizarCategorias() {
      const tipo = document.getElementById('tipo').value;
      const selectCategoria = document.getElementById('categoria');
      selectCategoria.innerHTML = '';
      
      categoriasOpcoes[tipo].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        selectCategoria.appendChild(option);
      });
    }

    function adicionarTransacao(e) {
      e.preventDefault();
      const descricao = document.getElementById('descricao').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;
      const data = document.getElementById('data').value;

      transacoes.push({ id: Date.now(), descricao, valor, tipo, categoria, data });
      salvarEAtualizar();

      document.getElementById('descricao').value = '';
      document.getElementById('valor').value = '';
    }

    function removerTransacao(id) {
      transacoes = transacoes.filter(t => t.id !== id);
      salvarEAtualizar();
    }

    function limparTudo() {
      if (confirm('Tem certeza que deseja apagar todos os registros do telemóvel?')) {
        transacoes = [];
        salvarEAtualizar();
      }
    }

    function salvarEAtualizar() {
      localStorage.setItem('transacoesFinanceiras', JSON.stringify(transacoes));
      atualizarInterface();
    }

    function formatarMoeda(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function atualizarInterface() {
      let receitas = 0;
      let despesas = 0;
      const listaTbody = document.getElementById('lista-transacoes');
      listaTbody.innerHTML = '';

      const transacoesOrdenadas = [...transacoes].sort((a, b) => new Date(b.data) - new Date(a.data));

      transacoesOrdenadas.forEach(t => {
        if (t.tipo === 'Receita') receitas += t.valor;
        if (t.tipo === 'Despesa') despesas += t.valor;

        const cat = t.categoria || '📦 Outros';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="py-2.5">
            <div class="font-semibold text-slate-700">${t.descricao}</div>
            <div class="text-[10px] text-slate-400">${cat} • ${t.data.split('-').reverse().join('/')}</div>
          </td>
          <td class="py-2.5 font-bold ${t.tipo === 'Receita' ? 'text-emerald-600' : 'text-rose-600'}">
            ${t.tipo === 'Receita' ? '+' : '-'} ${formatarMoeda(t.valor)}
          </td>
          <td class="py-2.5 text-right">
            <button onclick="removerTransacao(${t.id})" class="text-slate-400 hover:text-rose-500 font-bold px-1">✕</button>
          </td>
        `;
        listaTbody.appendChild(tr);
      });

      document.getElementById('total-receitas').textContent = formatarMoeda(receitas);
      document.getElementById('total-despesas').textContent = formatarMoeda(despesas);
      document.getElementById('saldo-total').textContent = formatarMoeda(receitas - despesas);

      atualizarDetalhamentoMes();
      atualizarGrafico(receitas, despesas);
    }

    function atualizarDetalhamentoMes() {
      const agora = new Date();
      const mesAtualStr = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}`;
      
      const mesesNomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      document.getElementById('mes-atual-label').textContent = `${mesesNomes[agora.getMonth()]} / ${agora.getFullYear()}`;

      const despesasMes = transacoes.filter(t => t.tipo === 'Despesa' && t.data.startsWith(mesAtualStr));
      
      const totaisPorCat = {};
      let totalDespesasMes = 0;

      despesasMes.forEach(t => {
        const cat = t.categoria || '📦 Outros';
        totaisPorCat[cat] = (totaisPorCat[cat] || 0) + t.valor;
        totalDespesasMes += t.valor;
      });

      const container = document.getElementById('container-categorias');
      container.innerHTML = '';

      if (Object.keys(totaisPorCat).length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhuma despesa registrada neste mês.</p>`;
        return;
      }

      Object.entries(totaisPorCat)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, valor]) => {
          const pct = totalDespesasMes > 0 ? ((valor / totalDespesasMes) * 100).toFixed(0) : 0;
          
          const item = document.createElement('div');
          item.className = "space-y-1";
          item.innerHTML = `
            <div class="flex justify-between font-medium">
              <span class="text-slate-700">${cat}</span>
              <span class="font-bold text-slate-800">${formatarMoeda(valor)} <span class="text-[10px] text-slate-400 font-normal">(${pct}%)</span></span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-1.5">
              <div class="bg-rose-500 h-1.5 rounded-full" style="width: ${pct}%"></div>
            </div>
          `;
          container.appendChild(item);
        });
    }

    function atualizarGrafico(receitas, despesas) {
      const ctx = document.getElementById('graficoFinanceiro').getContext('2d');
      if (meuGrafico) meuGrafico.destroy();

      meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Receitas', 'Despesas'],
          datasets: [{
            data: [receitas, despesas],
            backgroundColor: ['#10b981', '#f43f5e']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    // Exportação em formato CSV
    function exportarCSV() {
      if (transacoes.length === 0) {
        alert('Não há dados cadastrados para exportar!');
        return;
      }
      let csv = '\uFEFFDescrição;Valor;Tipo;Categoria;Data\n';
      transacoes.forEach(t => {
        const cat = t.categoria || '📦 Outros';
        csv += `"${t.descricao}";${t.valor};"${t.tipo}";"${cat}";"${t.data}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_financeiro_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Importação de ficheiro CSV
    function importarCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const linhas = e.target.result.split('\n');
        let importados = 0;
        for (let i = 1; i < linhas.length; i++) {
          const linha = linhas[i].trim();
          if (!linha) continue;
          const cols = linha.split(';').map(c => c.replace(/^"|"$/g, ''));
          if (cols.length >= 5) {
            const [descricao, valorStr, tipo, categoria, data] = cols;
            const valor = parseFloat(valorStr.replace(',', '.'));
            if (descricao && !isNaN(valor) && tipo && data) {
              transacoes.push({
                id: Date.now() + Math.random(),
                descricao,
                valor,
                tipo,
                categoria,
                data
              });
              importados++;
            }
          }
        }
        if (importados > 0) {
          salvarEAtualizar();
          alert(`${importados} lançamentos restaurados com sucesso!`);
        } else {
          alert('Ficheiro inválido ou sem dados compatíveis.');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // Inicialização
    atualizarCategorias();
    atualizarInterface();
  </script>
</body>
</html>
