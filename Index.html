<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Financeiro Pessoal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <div class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
    <!-- Cabeçalho -->
    <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Meu Controle Financeiro</h1>
        <p class="text-sm text-gray-500">Acompanhamento diário de receitas e despesas</p>
      </div>
      <button onclick="limparTudo()" class="text-xs text-red-500 hover:text-red-700 underline">Limpar Dados</button>
    </header>

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500">
        <p class="text-xs font-semibold text-gray-400 uppercase">Receitas</p>
        <p id="total-receita" class="text-2xl font-bold text-emerald-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-rose-500">
        <p class="text-xs font-semibold text-gray-400 uppercase">Despesas</p>
        <p id="total-despesa" class="text-2xl font-bold text-rose-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-blue-500">
        <p class="text-xs font-semibold text-gray-400 uppercase">Saldo Total</p>
        <p id="saldo-total" class="text-2xl font-bold text-blue-600 mt-1">R$ 0,00</p>
      </div>
    </div>

    <!-- Seção Principal: Formulário e Gráfico -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Formulário -->
      <div class="bg-white p-6 rounded-2xl shadow-sm md:col-span-1">
        <h2 class="text-lg font-bold mb-4">Nova Transação</h2>
        <form id="finance-form" onsubmit="adicionarTransacao(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descrição</label>
            <input type="text" id="desc" placeholder="Ex: Salário, Mercado" required class="w-full p-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00" required class="w-full p-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tipo</label>
            <select id="tipo" class="w-full p-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="receita">Receita (+)</option>
              <option value="despesa">Despesa (-)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Data</label>
            <input type="date" id="data" required class="w-full p-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-medium p-2.5 rounded-xl hover:bg-blue-700 transition">Adicionar</button>
        </form>
      </div>

      <!-- Gráfico e Resumo Visual -->
      <div class="bg-white p-6 rounded-2xl shadow-sm md:col-span-2 flex flex-col justify-center items-center">
        <h2 class="text-lg font-bold mb-2 self-start">Balanço Visual</h2>
        <div class="w-full max-w-xs h-64">
          <canvas id="graficoFinanceiro"></canvas>
        </div>
      </div>
    </div>

    <!-- Lista de Transações -->
    <div class="bg-white p-6 rounded-2xl shadow-sm">
      <h2 class="text-lg font-bold mb-4">Histórico de Lançamentos</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-xs uppercase text-gray-400">
              <th class="py-2">Data</th>
              <th class="py-2">Descrição</th>
              <th class="py-2">Tipo</th>
              <th class="py-2">Valor</th>
              <th class="py-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes" class="divide-y text-sm">
            <!-- As transações serão inseridas aqui dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let transacoes = JSON.parse(localStorage.getItem('financas_dados')) || [];
    let meuGrafico = null;

    document.getElementById('data').valueAsDate = new Date();

    function salvarEDesenhar() {
      localStorage.setItem('financas_dados', JSON.stringify(transacoes));
      atualizarResumo();
      atualizarLista();
      atualizarGrafico();
    }

    function adicionarTransacao(e) {
      e.preventDefault();
      const desc = document.getElementById('desc').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;
      const data = document.getElementById('data').value;

      transacoes.push({ id: Date.now(), desc, valor, tipo, data });
      document.getElementById('finance-form').reset();
      document.getElementById('data').valueAsDate = new Date();

      salvarEDesenhar();
    }

    function removerTransacao(id) {
      transacoes = transacoes.filter(t => t.id !== id);
      salvarEDesenhar();
    }

    function limparTudo() {
      if (confirm("Tem certeza que deseja apagar todo o histórico?")) {
        transacoes = [];
        salvarEDesenhar();
      }
    }

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function atualizarResumo() {
      const receitas = transacoes.filter(t => t.tipo === 'receita').reduce((acc, t) => acc + t.valor, 0);
      const despesas = transacoes.filter(t => t.tipo === 'despesa').reduce((acc, t) => acc + t.valor, 0);
      const saldo = receitas - despesas;

      document.getElementById('total-receita').innerText = formatarMoeda(receitas);
      document.getElementById('total-despesa').innerText = formatarMoeda(despesas);
      document.getElementById('saldo-total').innerText = formatarMoeda(saldo);
    }

    function atualizarLista() {
      const tbody = document.getElementById('lista-transacoes');
      tbody.innerHTML = '';

      if (transacoes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">Nenhum lançamento cadastrado.</td></tr>`;
        return;
      }

      transacoes.sort((a, b) => new Date(b.data) - new Date(a.data)).forEach(t => {
        const tr = document.createElement('tr');
        const isReceita = t.tipo === 'receita';
        const dataFormatada = new Date(t.data + 'T00:00:00').toLocaleDateString('pt-BR');

        tr.innerHTML = `
          <td class="py-3 text-gray-500">${dataFormatada}</td>
          <td class="py-3 font-medium">${t.desc}</td>
          <td class="py-3">
            <span class="px-2 py-1 text-xs rounded-full ${isReceita ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${isReceita ? 'Receita' : 'Despesa'}
            </span>
          </td>
          <td class="py-3 font-semibold ${isReceita ? 'text-emerald-600' : 'text-rose-600'}">
            ${isReceita ? '+' : '-'} ${formatarMoeda(t.valor)}
          </td>
          <td class="py-3 text-right">
            <button onclick="removerTransacao(${t.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function atualizarGrafico() {
      const receitas = transacoes.filter(t => t.tipo === 'receita').reduce((acc, t) => acc + t.valor, 0);
      const despesas = transacoes.filter(t => t.tipo === 'despesa').reduce((acc, t) => acc + t.valor, 0);

      const ctx = document.getElementById('graficoFinanceiro').getContext('2d');

      if (meuGrafico) {
        meuGrafico.destroy();
      }

      meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Receitas', 'Despesas'],
          datasets: [{
            data: [receitas, despesas],
            backgroundColor: ['#10B981', '#F43F5E'],
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    salvarEDesenhar();
  </script>
</body>
</html>
